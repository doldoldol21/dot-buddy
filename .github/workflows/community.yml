name: Community characters

# Pull requests: check every pack in community/ and load it in the app, check the pull request's own rules
# (one pack, the author's own), and upload the changed packs' previews as the 'previews' artifact for review.
# After a merge: draw previews for new or changed packs, then commit community/index.json and the gallery in community/README.md.
on:
  pull_request:
    paths: ["community/**", "scripts/community.py", "Sources/Charas.swift", "Sources/Demo.swift"]
  push:
    branches: [main]
    paths: ["community/**", "scripts/community.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check packs
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                                        # check-pr compares with the base branch
      - name: Build
        run: APP="$RUNNER_TEMP/Dot.app" FORCE=1 ./build.sh
      - name: Check
        run: python3 scripts/community.py check --app bin/DotBuddy
      - name: Pull request rules and previews
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/community.py check-pr --base "$BASE" --author "$AUTHOR" --app bin/DotBuddy --previews "$RUNNER_TEMP/previews"
      - name: Upload previews for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: previews
          path: ${{ runner.temp }}/previews
          if-no-files-found: ignore

  publish:
    name: Update the gallery and index
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    permissions:
      contents: write
    concurrency: community-publish
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: APP="$RUNNER_TEMP/Dot.app" FORCE=1 ./build.sh
      - name: Previews, index and gallery
        run: python3 scripts/community.py build --app bin/DotBuddy
      - name: Commit
        run: |
          git add community
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "community: update previews, index and gallery"
          git push
