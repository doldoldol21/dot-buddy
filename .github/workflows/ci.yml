name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and self-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: APP="$RUNNER_TEMP/Dot.app" FORCE=1 ./build.sh

      - name: Self-test
        run: python3 selftest.py

      - name: Pre-check rules
        run: python3 -I tests/test_precheck.py

      - name: Contributors list
        run: python3 -I tests/test_contributors.py

      # The community characters in dot-buddy/characters must still pass its checks and load in this build
      - uses: actions/checkout@v7
        with:
          repository: dot-buddy/characters
          path: .characters
      - name: Community characters still load
        env:
          DOTBUDDY_SRC: ${{ github.workspace }}
          PACKS_ROOT: ${{ github.workspace }}/.characters
        run: python3 .characters/scripts/packs.py check --app bin/DotBuddy

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that VERSION matches the tag
        run: |
          v="$(tr -d ' \n' < VERSION)"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::VERSION says $v but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build universal app
        run: APP="$RUNNER_TEMP/Dot Buddy.app" FORCE=1 BUILD_KIND=release ./build.sh --universal

      - name: Verify the bundle
        run: |
          app="$RUNNER_TEMP/Dot Buddy.app"
          lipo -archs "$app/Contents/MacOS/DotBuddy"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/DotBuddy" --version

      - name: Zip
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Dot Buddy.app" "Dot-Buddy-${GITHUB_REF_NAME#v}.zip"

      - name: Sign for the in-app updater
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          zip="Dot-Buddy-${GITHUB_REF_NAME#v}.zip"
          swift scripts/sign-update.swift "$zip" > "$zip.sig"
          "$RUNNER_TEMP/Dot Buddy.app/Contents/MacOS/DotBuddy" --verify-update "$zip" "$zip.sig"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Dot-Buddy-${GITHUB_REF_NAME#v}.zip" "Dot-Buddy-${GITHUB_REF_NAME#v}.zip.sig" \
            --title "Dot Buddy ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

  update-tap:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Version and checksum of the published zip
        id: v
        run: |
          ver="${GITHUB_REF_NAME#v}"
          curl -fsSL -o app.zip "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Dot-Buddy-${ver}.zip"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum app.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: doldoldol21/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Bump the cask
        run: |
          sed -i -E 's/^  version ".*"/  version "${{ steps.v.outputs.ver }}"/; s/^  sha256 ".*"/  sha256 "${{ steps.v.outputs.sha }}"/' Casks/dot-buddy.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dot-buddy ${{ steps.v.outputs.ver }}"
          git push
