# Categories for GitHub's generated release notes. scripts/release-notes.py writes the notes itself and takes only the "New Contributors" part from them.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: New features
      labels: [enhancement]
    - title: Characters
      labels: [character]
    - title: Bug fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
